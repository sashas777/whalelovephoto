services:
  nextjs-app:
    image: registry.superstar.sashas.cc/katya-nextjs-app:latest
    ports:
      - "3015:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

